<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dugout Card</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--ink:#0e1a3a;--mute:#5a6684;--line:#d3daea;--grass:#1b4fd1;--grass-t:#e9efff;--amber:#ffd100;--bad:#d32f2f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin-inline:auto;padding:0 14px 40px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 8px}
h1{font-size:30px;line-height:1.1;color:var(--grass);border-bottom:4px solid var(--amber)}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
nav button{flex:1;padding:10px 4px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 15px system-ui;cursor:pointer}
nav button[aria-selected=true]{background:var(--grass);border-color:var(--grass);color:#fff;box-shadow:inset 0 -4px 0 var(--amber)}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--grass);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],textarea,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:10px 14px;border-radius:10px;border:1.5px solid var(--grass);background:var(--grass);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.out{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.warn{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.big{width:100%;padding:16px;font-size:18px}
.mini{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px}
.plist{list-style:none;margin:10px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.num{width:26px;font-family:"Barlow Condensed",sans-serif;font-size:20px;color:var(--grass);text-align:center}
.muted{color:var(--mute);font-size:14px}
.pos{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.pos b{font-family:"Barlow Condensed",sans-serif;font-size:22px;color:var(--grass)}
.dup select{border-color:var(--bad)}
.inn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.inn h2{font-size:26px}
.now{border-left:8px solid var(--amber);background:var(--grass-t)}
.now .name{color:var(--grass);font-family:"Barlow Condensed",sans-serif;font-size:40px;line-height:1.05}
.outs{display:flex;gap:8px;align-items:center}
.dot{width:22px;height:22px;border-radius:5px;border:2px solid #b9c3dc;background:#fff}
.dot.on{background:var(--bad);border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log p{margin:4px 0}
.empty{color:var(--mute);padding:8px 0}
.gname{font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1.1;margin:2px 0}
details{margin-bottom:12px}
summary{cursor:pointer;font-weight:600;padding:10px 0}
textarea{min-height:90px;resize:vertical}
label.muted{display:block;margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
option:disabled{color:var(--mute)}
.note{margin:0 0 8px;font-size:13px;color:var(--mute)}
.ro #app button:not(#fp):not(#fn):not([data-finn]),.ro #app input,.ro #app select,.ro #app textarea{pointer-events:none;opacity:.6}
.ro #reset,.ro .editonly{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{flex:1;min-width:52px;padding:10px 0;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;font:600 15px system-ui,sans-serif}
.chip.on{background:var(--grass);border-color:var(--grass);color:#fff;box-shadow:inset 0 -4px 0 var(--amber)}
.plan{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
.plan th,.plan td{padding:6px 4px;border-bottom:1px solid var(--line)}
.plan .n{text-align:left;white-space:nowrap}
.plan td.p{color:var(--grass);font-weight:700}
.plan td.b{background:var(--amber);color:#0e1a3a;font-weight:700}
.plan td.a,.plan td.e{color:var(--mute)}
.washed{opacity:.65}.washed .gname{text-decoration:line-through}
.btn.absent{background:var(--bad);border-color:var(--bad);color:#fff}
.plist li.ed{border-top:0;padding-top:0}
.map{width:100%;height:auto;display:block}
.map .turf{fill:#fff6c2;stroke:#e6d98a}
.map .dirt{fill:var(--card);stroke:var(--grass);stroke-width:2}
.map .chip{fill:var(--grass)}
.map .chip.off{fill:var(--bg);stroke:var(--mute);stroke-dasharray:3 3}
.map .pl{fill:#fff;font:700 12px system-ui,sans-serif;text-anchor:middle}
.map .chip.off+.pl{fill:var(--mute)}
.map .nm{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff6c2;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<header><h1 id="h1">Dugout Card</h1><span style="display:flex;gap:6px"><button class="btn ghost" id="auth" style="display:none">Editor login</button><button class="btn ghost" id="reset">Clear game</button></span></header>
<p class="note" id="note" role="status"></p>
<nav role="tablist">
<button role="tab" data-tab="games">Games</button>
<button role="tab" data-tab="roster">Team</button>
<button role="tab" data-tab="field">Fielding</button>
<button role="tab" data-tab="bat">Batting</button>
</nav>
<main id="app"></main>
<script>
const POS=['P','C','1B','2B','3B','SS','LF','CF','RF'];
const KEY='dugout-card-v1';
const LIVE=['inn','fInn','idx','outs','field','log','absent','first','phase','maxInn'];
const liveFresh=()=>({inn:1,fInn:1,idx:0,outs:0,field:{},log:{},absent:[],first:null,phase:null,maxInn:4});
const fresh=()=>Object.assign({players:[],tab:'games',nid:1,club:'',games:[],gid:1,cur:0,free:null},liveFresh());
let S=fresh(),hist=[],editId=0,showAll=false,showRoster=false,canWrite=true,dref=null,applying=false,lastJson='',lastSent='',timer=0,busy=false,dirty=false,pendJ=null;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushRemote()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>{const p=S.players.find(p=>p.id==id);return p?p.name:'—'};
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift()};
const $=s=>document.querySelector(s);

const curRec=()=>S.games.find(g=>g.id===S.cur);
function stash(){const o={};LIVE.forEach(k=>o[k]=S[k]);const r=curRec();if(r)r.g=o;else S.free=o}
function loadLive(g){Object.assign(S,liveFresh(),g||{})}
function play(id){stash();S.cur=id;const r=curRec();loadLive(r?r.g:S.free);hist=[]}
const pd=s=>{s=(s||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/),y,mo,d;
 if(m){[y,mo,d]=[+m[1],+m[2],+m[3]]}else if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/)){[d,mo,y]=[+m[1],+m[2],+m[3]<100?2000+ +m[3]:+m[3]]}else return null;
 return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')};
const dt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=s=>dt(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const daysTo=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((dt(s)-t)/864e5)};
const when=n=>n===0?'Today':n===1?'Tomorrow':n>1?'in '+n+' days':'';
const addGame=o=>S.games.push({id:S.gid++,rnd:o.rnd||0,date:o.date,time:o.time||'',opp:o.opp,home:o.home,where:o.where||'',g:null});
const fmtTime=t=>{if(!/^\d{1,2}:\d{2}$/.test(t||''))return t||'';const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'am':'pm')};
const isAbs=id=>S.absent.includes(id);
const nextIdx=i=>{const n=S.players.length;for(let k=1;k<=n;k++){const j=(i+k)%n;if(!isAbs(S.players[j].id))return j}return i};
const cbi=()=>{const i=S.idx%S.players.length;return isAbs(S.players[i].id)?nextIdx(i):i};
const startCard=()=>`<div class="card now"><b>Who's first?</b><p class="muted" style="margin:4px 0 10px">What is the team doing in the first inning?</p><div class="cols"><button class="btn big" data-first="bat">Batting first</button><button class="btn big" data-first="field">Fielding first</button></div></div>`;
function endHalf(){
 if(S.phase!==S.first)S.inn++;
 S.outs=0;
 S.phase=S.phase==='bat'?'field':'bat';
 if(S.phase==='field'){S.fInn=S.inn;if(!S.field[S.inn]&&S.field[S.inn-1])S.field[S.inn]=Object.assign({},S.field[S.inn-1]);S.tab='field'}else S.tab='bat';
}
const ctx=()=>{const r=curRec();return `<p class="muted" style="margin:0 0 8px">${r?`${r.home?'vs':'@'} ${esc(r.opp)} · ${fmtDate(r.date)}`:'No game selected. Pick one on the Games tab, or practise here.'}</p>`};
function gameCard(g,next){
 const n=daysTo(g.date);
 return `<div class="card ${next&&!g.washed?'now':''} ${g.washed?'washed':''}"><div class="muted">${g.washed?'Washed out · ':''}${next&&!g.washed?'Next game · ':''}${g.rnd?'Round '+g.rnd+' · ':''}${fmtDate(g.date)}${g.time?' · '+esc(fmtTime(g.time)):''}${n>=0?' · '+when(n):''}</div>
 <div class="gname">${g.home?'vs':'@'} ${esc(g.opp)}</div>${g.where?`<div class="muted">${esc(g.where)}</div>`:''}
 <div class="row" style="margin-top:10px;flex-wrap:wrap">${g.washed?'':`<button class="btn ${S.cur===g.id?'':'ghost'}" data-play="${g.id}">${S.cur===g.id?'Playing now':'Play this game'}</button>`}<button class="btn ghost" data-wash="${g.id}">${g.washed?'Undo washed out':'Washed out'}</button><span class="grow"></span><button class="mini" data-gdel="${g.id}" aria-label="Delete game vs ${esc(g.opp)}">✕</button></div></div>`}
function games(){
 const all=[...S.games].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const t=todayStr(),up=all.filter(g=>g.date>=t),past=all.filter(g=>g.date<t).reverse();
 return `${S.club?`<p class="muted" style="margin:0 0 8px">${esc(S.club)} · ${S.players.length} players</p>`:''}
 ${up.length?up.map(g=>gameCard(g,g===up.find(x=>!x.washed))).join(''):`<div class="card empty">${S.games.length?'No upcoming games.':'No games yet. Add one below or paste your schedule.'}</div>`}
 ${past.length?`<details><summary>Past games (${past.length})</summary>${past.map(g=>gameCard(g,false)).join('')}</details>`:''}
 <details class="editonly" ${S.games.length?'':'open'}><summary>Add a game</summary><div class="card">
 <div class="f2"><div><label class="muted" for="gd">Date</label><input type="date" id="gd"></div><div><label class="muted" for="gt">Time</label><input type="time" id="gt"></div></div>
 <div class="f2"><div><label class="muted" for="go">Opponent</label><input type="text" id="go" maxlength="40"></div><div><label class="muted" for="gh">Home or away</label><select id="gh"><option value="1">Home</option><option value="0">Away</option></select></div></div>
 <label class="muted" for="gl">Field or location (optional)</label><input type="text" id="gl" maxlength="60" style="margin-bottom:10px">
 <button class="btn" id="gadd" style="width:100%">Add game</button></div></details>
 <details class="editonly"><summary>Paste a schedule</summary><div class="card"><p class="muted" style="margin-top:0">One game per line: date, time, opponent, Home or Away, location. Dates can be 2026-10-17 or 17/10/2026.</p>
 <textarea id="gp" aria-label="Schedule lines" placeholder="17/10/2026, 10:00, Rams, Home, Field 2"></textarea><button class="btn" id="gimp" style="width:100%;margin-top:8px">Import games</button><p class="muted" id="gmsg" style="margin-bottom:0"></p></div></details>`;
}
function roster(){
 return `<div class="card"><label class="muted" for="club">Club name</label><input type="text" id="club" maxlength="50" value="${esc(S.club)}" placeholder="Your club"></div>
 <div class="card"><h2 style="margin-bottom:8px">Season roster</h2><div class="row"><div class="grow"><input type="text" id="pn" placeholder="Player name" aria-label="Player name" maxlength="30"></div><button class="btn" id="add">Add player</button></div>
 <div class="f2" style="margin:8px 0 0;grid-template-columns:1fr 2fr"><input type="text" id="pnum" inputmode="numeric" maxlength="3" placeholder="Number" aria-label="Jersey number"><input type="text" id="ppos" maxlength="60" placeholder="Preferred positions" aria-label="Preferred positions"></div>
 ${(()=>{const m=ROSTER.filter(r=>!S.players.some(p=>p.name===r[0]));return m.length?`<label class="muted" for="restore" style="margin-top:12px">Removed someone by mistake? Restore from the team sheet</label><select id="restore"><option value="">Choose a player...</option>${m.map(r=>`<option value="${esc(r[0])}">#${esc(r[1])} ${esc(r[0])}</option>`).join('')}</select>`:''})()}
 <p class="muted" style="margin:10px 0 0">Listed in batting order. The same players carry through every game.</p>
 <ul class="plist">${S.players.length?S.players.map((p,i)=>`<li><span class="num">${i+1}</span><span class="grow"><b>${p.num?'#'+esc(p.num)+' ':''}</b>${esc(p.name)}${p.pos?`<div class="muted">${esc(p.pos)}</div>`:''}</span>
 <button class="mini" data-up="${i}" aria-label="Move ${esc(p.name)} up">↑</button><button class="mini" data-dn="${i}" aria-label="Move ${esc(p.name)} down">↓</button><button class="mini" data-edit="${p.id}" aria-label="Edit ${esc(p.name)}">✎</button><button class="mini" data-rm="${i}" aria-label="Remove ${esc(p.name)}">✕</button></li>${editId===p.id?`<li class="ed"><div class="grow"><div class="f2" style="grid-template-columns:2fr 1fr"><input type="text" data-f="name" data-pid="${p.id}" value="${esc(p.name)}" aria-label="Name"><input type="text" data-f="num" data-pid="${p.id}" value="${esc(p.num||'')}" inputmode="numeric" maxlength="3" placeholder="No." aria-label="Jersey number"></div><input type="text" data-f="pos" data-pid="${p.id}" value="${esc(p.pos||'')}" placeholder="Preferred positions" aria-label="Preferred positions"></div></li>`:''}`).join(''):'<li class="empty">No players yet. Add your first batter above.</li>'}</ul></div>`;
}
const XY={P:[160,196],C:[160,286],'1B':[238,186],'2B':[202,138],SS:[118,138],'3B':[82,186],LF:[52,88],CF:[160,48],RF:[268,88]};
function diamond(f){
 const short=s=>s.length>10?s.slice(0,9)+'…':s;
 return `<svg class="map" viewBox="0 0 320 310" role="img" aria-label="Field map for inning ${S.fInn}">
 <path class="turf" d="M160 258 L22 120 A196 196 0 0 1 298 120 Z"/>
 <path class="dirt" d="M160 258 L226 192 L160 126 L94 192 Z"/>
 ${POS.map(p=>{const [x,y]=XY[p],v=f[p],on=!!v;
 return `<g><circle class="chip ${on?'':'off'}" cx="${x}" cy="${y}" r="16"/><text class="pl" x="${x}" y="${y+4}">${p}</text><text class="nm" x="${x}" y="${y+32}">${on?esc(short(nm(v))):'Empty'}</text></g>`}).join('')}
 </svg>`;
}
const gameData=r=>r.id===S.cur?{field:S.field,absent:S.absent}:{field:(r.g&&r.g.field)||{},absent:(r.g&&r.g.absent)||[]};
function tally(d){
 const t={};S.players.forEach(p=>t[p.id]={f:0,b:0});
 Object.keys(d.field).forEach(i=>{
  const m=d.field[i],set=new Set(POS.map(x=>String(m[x]||'')).filter(Boolean));
  if(!set.size)return;
  S.players.forEach(p=>{if(d.absent.includes(p.id))return;if(set.has(String(p.id)))t[p.id].f++;else t[p.id].b++});
 });
 return t;
}
function seasonTally(skipCur){
 const t={};S.players.forEach(p=>t[p.id]={f:0,b:0});
 S.games.forEach(r=>{if(r.washed||(skipCur&&r.id===S.cur))return;const x=tally(gameData(r));S.players.forEach(p=>{t[p.id].f+=x[p.id].f;t[p.id].b+=x[p.id].b})});
 return t;
}
const rnd=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function assign(pick){
 const who={};
 const tryP=(p,seen)=>{for(const x of rnd(wants(p))){if(seen.has(x))continue;seen.add(x);if(!who[x]||tryP(who[x],seen)){who[x]=p;return true}}return false};
 let score=0;const un=[];
 rnd(pick).forEach(p=>{if(tryP(p,new Set()))score++;else un.push(p)});
 rnd(POS.filter(x=>!who[x])).forEach((x,i)=>{if(un[i])who[x]=un[i]});
 const map={};POS.forEach(x=>{map[x]=who[x]?String(who[x].id):''});
 return {map,score,pick};
}
function autoFill(list){
 const pres=S.players.filter(p=>!isAbs(p.id));
 if(!pres.length)return;
 const played={};pres.forEach(p=>played[p.id]=0);
 Object.keys(S.field).forEach(i=>{if(list.includes(+i))return;POS.forEach(x=>{const v=S.field[i][x];if(v&&played[v]!==undefined)played[v]++})});
 const sb=seasonTally(true);
 list.forEach(inn=>{
  let best=null;
  for(let t=0;t<40;t++){
   const order=rnd(pres).sort((a,b)=>played[a.id]-played[b.id]||sb[b.id].b-sb[a.id].b);
   const r=assign(order.slice(0,Math.min(9,order.length)));
   if(!best||r.score>best.score)best=r;
   if(r.score===r.pick.length)break;
  }
  S.field[inn]=best.map;best.pick.forEach(p=>played[p.id]++);
 });
}
function planCard(){
 const N=Math.max(S.maxInn,1),cur=tally({field:S.field,absent:S.absent}),seas=seasonTally(false);
 const short=n=>{const w=n.trim().split(/\s+/);return w.length>1?w[0]+' '+w[w.length-1][0]:w[0]};
 const rows=S.players.map(p=>{
  let c='';
  for(let i=1;i<=N;i++){const m=S.field[i]||{},has=POS.some(x=>m[x]),pos=POS.find(x=>String(m[x])===String(p.id));
   c+=isAbs(p.id)?'<td class="a">A</td>':pos?`<td class="p">${pos}</td>`:has?'<td class="b">B</td>':'<td class="e">·</td>'}
  return `<tr><td class="n">${p.num?'#'+esc(p.num)+' ':''}${esc(short(p.name))}</td>${c}<td>${cur[p.id].b}</td><td>${seas[p.id].f}/${seas[p.id].b}</td></tr>`}).join('');
 return `<div class="card"><b>Game plan and bench time</b><p class="muted" style="margin:4px 0 8px">B = on the bench, A = absent. Season shows innings fielded / benched.</p>
 <div style="overflow-x:auto"><table class="plan"><thead><tr><th class="n">Player</th>${Array.from({length:N},(_,i)=>`<th>${i+1}</th>`).join('')}<th>Bench</th><th>Season</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="row" style="margin-top:12px"><span class="grow">Innings in this game</span><button class="mini" id="mim" aria-label="Fewer innings">−</button><b>${S.maxInn}</b><button class="mini" id="mip" aria-label="More innings">+</button></div></div>`;
}
function wants(p){
 const t=(p.pos||'').toLowerCase().trim(),r=new Set();
 if(!t)return POS;
 if(/(but|except|not|besides)\W+(a\W+)?catch/.test(t))return POS.filter(x=>x!=='C');
 if(/no pref|any ?thing|any ?where|any position|^any$|^all$/.test(t))return POS;
 if(/any base/.test(t))['1B','2B','3B'].forEach(x=>r.add(x));
 const k=[[/pitch/,['P']],[/catch/,['C']],[/first|1st|\b1b\b/,['1B']],[/second|2nd|\b2b\b/,['2B']],[/third|3rd|\b3b\b/,['3B']],[/short\s?stop|shorty|\bss\b/,['SS']],[/left\s?field|\blf\b/,['LF']],[/right\s?field|\brf\b/,['RF']],[/cent(er|re)|\bcf\b/,['CF']],[/out\s?field/,['LF','CF','RF']]];
 k.forEach(([re,ps])=>{if(re.test(t))ps.forEach(x=>r.add(x))});
 return r.size?[...r]:POS;
}
function field(){
 if(!S.players.length)return `<div class="card empty">Add players on the Team tab first.</div>`;
 const f=S.field[S.fInn]||{};
 const used=Object.values(f).filter(Boolean);
 const bench=S.players.filter(p=>!used.includes(String(p.id))&&!isAbs(p.id));
 const absent=S.players.filter(p=>isAbs(p.id));
 const rosterCard=`<div class="card"><div class="row"><div class="grow"><b>Game roster</b><div class="muted">${S.players.length-absent.length} of ${S.players.length} available${absent.length?' · Absent: '+absent.map(p=>esc(p.name)).join(', '):''}</div></div><button class="btn ghost" id="rost">${showRoster?'Done':'Edit'}</button></div>${showRoster?`<ul class="plist">${S.players.map(p=>`<li><span class="grow">${p.num?'<b>#'+esc(p.num)+'</b> ':''}${esc(p.name)}</span><button class="btn ${isAbs(p.id)?'absent':'ghost'}" data-abs="${p.id}" aria-pressed="${isAbs(p.id)}">Absent</button></li>`).join('')}</ul>`:''}</div>`;
 const phaseCard=!S.first?startCard():S.phase==='field'?`<div class="card now"><div class="muted">Inning ${S.inn} · We're fielding</div><div class="cols" style="margin-top:10px"><button class="btn big out" id="f3">3 outs</button><button class="btn big ghost" id="undo" ${hist.length?'':'disabled'}>Undo</button></div></div>`:`<div class="card"><b>We're batting this half</b><div class="muted">Inning ${S.inn}. Use the Batting tab. You can set fielding positions ahead of time.</div></div>`;
 return ctx()+phaseCard+rosterCard+`<div class="chips">${Array.from({length:Math.max(S.maxInn,S.inn,S.fInn)},(_,i)=>`<button class="chip ${i+1===S.fInn?'on':''}" data-finn="${i+1}">Inn ${i+1}</button>`).join('')}</div>
 <div class="cols" style="margin-bottom:12px"><button class="btn" id="af1">Auto-fill inning ${S.fInn}</button><button class="btn" id="afall">Auto-fill all ${S.maxInn}</button></div>
 <div class="card" style="padding:8px">${diamond(f)}</div>
 <div class="card">${POS.map(p=>{const v=f[p]||'';const dup=v&&used.filter(u=>u==v).length>1;
 return `<div class="pos ${dup?'dup':''}"><b>${p}</b><select data-pos="${p}" aria-label="${p} in inning ${S.fInn}"><option value="">Empty</option>${S.players.filter(q=>q.id==v||(!isAbs(q.id)&&(showAll||wants(q).includes(p)))).map(q=>{const at=POS.find(x=>x!==p&&f[x]==q.id);return `<option value="${q.id}" ${v==q.id?'selected':''} ${at&&v!=q.id?'disabled':''}>${q.num?'#'+esc(q.num)+' ':''}${esc(q.name)}${at?' ('+at+')':''}</option>`}).join('')}</select></div>`}).join('')}
 ${S.fInn>1?`<button class="btn ghost" id="cp" style="width:100%;margin-top:4px">Copy inning ${S.fInn-1} positions</button>`:''}</div>
 <div class="card"><b>Bench this inning</b><p class="muted" style="margin:6px 0 0">${bench.length?bench.map(b=>esc(b.name)).join(', '):'Everyone is on the field.'}</p>${used.length!==new Set(used).size?'<p style="color:var(--bad);margin:8px 0 0">A player is assigned to two positions.</p>':''}
 <button class="btn ghost" id="sall" style="width:100%;margin-top:10px">${showAll?'Only show players willing to play each position':'Show all players in every list'}</button></div>${planCard()}`;
}
function bat(){
 const n=S.players.length;
 if(!n)return `<div class="card empty">Add players on the Team tab first.</div>`;
 if(!S.first)return ctx()+startCard();
 const act=S.players.filter(p=>!isAbs(p.id));if(!act.length)return ctx()+'<div class="card empty">Everyone is marked absent. Update the game roster on the Fielding tab.</div>';const ci=cbi(),cur=S.players[ci],f=S.field[S.inn]||{};
 const posOf=id=>POS.find(p=>f[p]==id);
 if(S.phase==='field')return ctx()+`<div class="card now"><div class="muted">Inning ${S.inn}</div><div class="gname">We're fielding</div><p class="muted" style="margin:4px 0 10px">Next up to bat: ${cur.num?'#'+esc(cur.num)+' ':''}${esc(cur.name)}</p><button class="btn big" id="gof">Go to fielding</button></div>`;
 const nx1=S.players[nextIdx(ci)],nx2=S.players[nextIdx(nextIdx(ci))],m=act.length;
 const logs=Object.keys(S.log).map(Number).sort((a,b)=>b-a);
 return ctx()+`<div class="inn"><h2>Inning ${S.inn}</h2><div class="outs" aria-label="${S.outs} outs">${[0,1,2].map(i=>`<span class="dot ${i<S.outs?'on':''}"></span>`).join('')}<span class="muted">${S.outs} ${S.outs===1?'out':'outs'}</span></div></div>
 <div class="card now"><div class="muted">Batting ${S.players.slice(0,ci+1).filter(p=>!isAbs(p.id)).length}${posOf(cur.id)?' · playing '+posOf(cur.id):''}${cur.pos?' · preferred: '+esc(cur.pos):''}</div><div class="name">${cur.num?'#'+esc(cur.num)+' ':''}${esc(cur.name)}</div></div>
 ${m>1?`<div class="cols"><div class="card"><div class="muted">On deck</div><b>${esc(nx1.name)}</b></div><div class="card"><div class="muted">In the hole</div><b>${esc(nx2.name)}</b></div></div>`:''}
 <div class="cols" style="margin-bottom:8px"><button class="btn big" id="done">Batter done</button><button class="btn big out" id="out">Out</button></div>
 <div class="cols"><button class="btn ghost" id="undo" ${hist.length?'':'disabled'}>Undo</button><button class="btn ghost" id="ni">End batting half</button></div>
 <div class="card log" style="margin-top:12px"><b>Plate appearances</b>${logs.length?logs.map(i=>`<p><b>Inn ${i}:</b> ${S.log[i].map(esc).join(', ')}</p>`).join(''):'<p class="muted">Nothing logged yet.</p>'}</div>`;
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
 title();
 $('#app').innerHTML=S.tab==='games'?games():S.tab==='roster'?roster():S.tab==='field'?field():bat();
 save();
}
function title(){const t=S.club||'Dugout Card';$('#h1').textContent=t;document.title=t}
function advance(out){
 if(S.phase!=='bat')return;
 snap();
 if(!S.players.some(p=>!isAbs(p.id)))return;const ci=cbi(),cur=S.players[ci];
 (S.log[S.inn]=S.log[S.inn]||[]).push(cur.name);
 S.idx=nextIdx(ci);
 if(out){S.outs++;if(S.outs>=3)endHalf()}
 render();
}
document.querySelector('nav').addEventListener('click',e=>{const t=e.target.dataset.tab;if(t){S.tab=t;render()}});
$('#reset').onclick=()=>{if(!canWrite)return;if(confirm('Clear the batting log and positions for this game? Your roster and schedule stay.')){loadLive();hist=[];render()}};
$('#app').addEventListener('click',e=>{
 const d=e.target.dataset,id=e.target.id,n=S.players.length;
 if(!canWrite&&id!=='fp'&&id!=='fn'&&d.finn===undefined)return;
 if(id==='add'){const v=$('#pn').value.trim();if(v){S.players.push({id:S.nid++,name:v,num:$('#pnum').value.trim(),pos:$('#ppos').value.trim()});render();$('#pn').focus()}}
 else if(d.up!==undefined){const i=+d.up;if(i>0){[S.players[i-1],S.players[i]]=[S.players[i],S.players[i-1]];render()}}
 else if(d.dn!==undefined){const i=+d.dn;if(i<n-1){[S.players[i+1],S.players[i]]=[S.players[i],S.players[i+1]];render()}}
 else if(d.rm!==undefined){const who=S.players[+d.rm];if(!who||!confirm('Remove '+who.name+' from the roster? You can restore them afterwards.'))return;const p=S.players.splice(+d.rm,1)[0];Object.values(S.field).forEach(f=>POS.forEach(q=>{if(f[q]==p.id)f[q]=''}));S.idx=n>1?S.idx%(n-1):0;render()}
 else if(d.first!==undefined){S.first=d.first;S.phase=d.first;S.outs=0;S.fInn=S.inn;S.tab=d.first==='bat'?'bat':'field';render()}
 else if(id==='f3'){snap();endHalf();render()}
 else if(id==='gof'){S.tab='field';render()}
 else if(d.finn!==undefined){S.fInn=+d.finn;render()}
 else if(id==='af1'){autoFill([S.fInn]);render()}
 else if(id==='afall'){const L=Array.from({length:S.maxInn},(_,i)=>i+1);if(!L.some(i=>S.field[i]&&POS.some(x=>S.field[i][x]))||confirm('Replace the positions for all '+S.maxInn+' innings?')){autoFill(L);render()}}
 else if(id==='mim'||id==='mip'){S.maxInn=Math.max(1,Math.min(9,S.maxInn+(id==='mip'?1:-1)));render()}
 else if(id==='rost'){showRoster=!showRoster;render()}
 else if(d.abs!==undefined){const pid=+d.abs,i=S.absent.indexOf(pid);if(i<0){S.absent.push(pid);Object.values(S.field).forEach(m=>POS.forEach(q=>{if(m[q]==pid)m[q]=''}))}else S.absent.splice(i,1);render()}
 else if(d.wash!==undefined){const g=S.games.find(g=>g.id===+d.wash);if(g){g.washed=!g.washed;render()}}
 else if(id==='sall'){showAll=!showAll;render()}
 else if(id==='fp'){S.fInn=Math.max(1,S.fInn-1);render()}
 else if(id==='fn'){S.fInn++;render()}
 else if(id==='cp'){S.field[S.fInn]=Object.assign({},S.field[S.fInn-1]);render()}
 else if(id==='done')advance(false);
 else if(id==='out')advance(true);
 else if(id==='ni'){snap();endHalf();render()}
 else if(id==='undo'&&hist.length){S=JSON.parse(hist.pop());render()}
 else if(d.edit!==undefined){editId=editId===+d.edit?0:+d.edit;render()}
 else if(d.play!==undefined){play(+d.play);S.tab='field';render()}
 else if(d.gdel!==undefined){if(confirm('Delete this game?')){const gid=+d.gdel;if(S.cur===gid){S.cur=0;loadLive(S.free)}S.games=S.games.filter(g=>g.id!==gid);render()}}
 else if(id==='gadd'){const date=$('#gd').value,opp=$('#go').value.trim();if(date&&opp){addGame({date,time:$('#gt').value,opp,home:$('#gh').value==='1',where:$('#gl').value.trim()});render()}}
 else if(id==='gimp'){let ok=0,bad=0;$('#gp').value.split('\n').forEach(l=>{if(!l.trim())return;const c=l.split(/\t|,/).map(x=>x.trim());const date=pd(c[0]);if(!date||!c[2]){bad++;return}addGame({date,time:c[1],opp:c[2],home:!/^a/i.test(c[3]||''),where:c.slice(4).join(', ')});ok++});render();if(bad){const m=$('#gmsg');if(m)m.textContent=bad+' line(s) skipped: check the date and opponent.'}}
});
$('#app').addEventListener('change',e=>{if(!canWrite)return;
 if(e.target.id==='restore'){const r=ROSTER.find(r=>r[0]===e.target.value);if(r){S.players.push({id:S.nid++,name:r[0],num:r[1],pos:r[2]});render()}return}const p=e.target.dataset.pos;if(p){(S.field[S.fInn]=S.field[S.fInn]||{})[p]=e.target.value;render()}});
$('#app').addEventListener('input',e=>{if(!canWrite)return;if(e.target.id==='club'){S.club=e.target.value;title();save()}else if(e.target.dataset.f){const p=S.players.find(p=>p.id==e.target.dataset.pid);if(p){p[e.target.dataset.f]=e.target.value;save()}}});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pn')$('#add').click()});
const setNote=t=>{const n=document.getElementById('note');if(n)n.textContent=t};
const shared=()=>{const r=Object.assign({},S);delete r.tab;delete r.fInn;return JSON.stringify(r)};
/* ---- Team sync (no Claude needed) --------------------------------------
   1. Create a free Firebase project and a Realtime Database.
   2. Paste its address below, e.g. https://my-team-default-rtdb.firebaseio.com
   3. Add the rules and the secret edit code described in the setup notes.
   Leave DB_URL empty and the app works on each phone on its own. */
const DB_URL='https://ryderams-b2736-default-rtdb.asia-southeast1.firebasedatabase.app';
const CK='dugout-edit-code';
let ready=false;
const getCode=()=>{try{return localStorage.getItem(CK)||''}catch(e){return ''}};
const setCode=c=>{try{c?localStorage.setItem(CK,c):localStorage.removeItem(CK)}catch(e){}};
function setMode(){
 canWrite=!DB_URL||!!getCode();
 document.body.classList.toggle('ro',!canWrite);
 const a=document.getElementById('auth');
 if(a){a.style.display=DB_URL?'':'none';a.textContent=getCode()?'Log out':'Editor login'}
 setNote(!DB_URL?'Saved on this phone only. Add the database address to share with the team.':canWrite?'Live: changes sync to the whole team.':'View only. Editors log in with the team edit code.');
}
function pushRemote(now){
 if(!DB_URL||!ready||!canWrite||applying)return;
 clearTimeout(timer);timer=setTimeout(flush,now?0:600);
}
async function flush(){
 if(busy){dirty=true;return}
 const j=shared();if(j===lastJson)return;
 busy=true;lastSent=j;
 try{
  const r=await fetch(DB_URL+'/state.json',{method:'PUT',body:JSON.stringify({json:j,key:getCode()})});
  if(r.ok){lastJson=j}
  else{lastSent='';if(r.status===401||r.status===403){setCode('');setMode();setNote('Edit code rejected. You are in view-only mode.')}else setNote('Could not save to the team (error '+r.status+').')}
 }catch(e){lastSent='';setNote('Offline. Changes are kept on this phone and will sync when you are back online.')}
 busy=false;
 if(dirty){dirty=false;pushRemote()}
}
function applyRemote(j){
 pendJ=j;
 const a=document.activeElement;
 if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){setTimeout(()=>{if(pendJ===j)applyRemote(j)},2000);return}
 let r;try{r=JSON.parse(j)}catch(e){return}
 const keep={tab:S.tab,fInn:S.fInn};
 applying=true;
 S=Object.assign(fresh(),r,keep);hist=[];lastJson=shared();
 try{render()}finally{applying=false}
}
async function login(){
 if(getCode()){setCode('');setMode();render();return}
 const c=(prompt('Enter the team edit code')||'').trim();
 if(!c)return;
 try{
  const r=await fetch(DB_URL+'/state/key.json',{method:'PUT',body:JSON.stringify(c)});
  if(r.ok){setCode(c);setMode();render()}else alert('That code was not accepted.')
 }catch(e){alert('Could not reach the team database. Check your connection.')}
}
function connect(){
 setMode();
 const a=document.getElementById('auth');if(a)a.onclick=login;
 if(!DB_URL||!window.EventSource)return;
 window.addEventListener('online',()=>pushRemote(true));
 const es=new EventSource(DB_URL+'/state/json.json');
 es.addEventListener('put',e=>{
  let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.path!=='/')return;
  ready=true;
  const j=m.data;
  if(j===null||j===undefined){if(canWrite){lastJson='';pushRemote(true)}return}
  if(typeof j==='string'&&j!==lastSent)applyRemote(j);
 });
 es.onopen=()=>setMode();
 es.onerror=()=>setNote('Reconnecting to the team...');
}

if(S.rver!==2){S.rver=2;ROSTER.forEach(r=>{const p=S.players.find(p=>p.name===r[0]||(r[3]&&p.name===r[3]));if(p){p.name=r[0];p.num=r[1];p.pos=r[2]}else S.players.push({id:S.nid++,name:r[0],num:r[1],pos:r[2]})})}
if(!S.seeded){S.seeded=1;if(!S.club)S.club='North Ryde Rams';if(!S.games.length)SEED.forEach(r=>addGame({rnd:r[0],date:r[1],time:r[2],opp:r[3],home:!!r[4],where:r[5]}))}
